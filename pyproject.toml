[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callprofiler"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "numpy",
    "requests>=2.34.2",
    "fastapi>=0.122.0",
    "uvicorn>=0.38.0",
    "jinja2>=3.1.6",
    "python-telegram-bot>=22.6",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.5",
]

# ML/audio-стек боевого GPU-бокса (ASR/диаризация). Ставить: pip install -e ".[full]"
#
# ВНИМАНИЕ: torch НАМЕРЕННО без нижней границы. Целевая машина (GPU-бокс) работает
# на Python 3.12 + torch==2.6.0+cu124 (CLAUDE.md Hard Constraints,
# requirements-gigaam.txt, bugs.md B1 2026-06-03). Floor, снятый с dev-машины
# (torch 2.9.1, CPU-only), ИСКЛЮЧИЛ БЫ боевое окружение: установка на боксе потянула
# бы апгрейд torch и снесла бы CUDA-сборку — ровно тот класс отказа, который стоил
# целого прогона. Точные версии рантайма фиксирует requirements-gigaam.txt, не этот extra.
full = [
    "torch",
    "faster-whisper",
    "pyannote.audio",
    "soundfile",
    "librosa",
]

# Набор для облачного/CI-прогона БЕЗ ML-стека (нет GPU, нет моделей, нет аудио).
# Ставить: pip install -e ".[cloud]"
#
# ВАЖНО (T-01-fix, 2026-08-21): extras в pip ТОЛЬКО ДОБАВЛЯЮТ пакеты к обязательным
# `dependencies` — они не могут ИСКЛЮЧИТЬ базовую зависимость. Пока torch/pyannote.audio/
# faster-whisper/soundfile/librosa жили в `dependencies` (см. `full` выше), сам факт
# существования extra `cloud` был бессилен их убрать: `pip install -e ".[cloud]"`
# всё равно тянул полный ML-стек. Прежняя заметка "измерено: 1415 passed..." была
# измерена СИМУЛЯЦИЕЙ отсутствия torch (заглушка импорта), а не реальной установкой
# через эту команду — поэтому расхождение не всплыло. Перепроверено реальным
# `pip install -e ".[cloud]"` в чистом venv (2026-08-21): pyproject ниже действительно
# не тянет ML/audio-пакеты, только когда они убраны из `dependencies`.
#
# Этот extra сам по себе избыточен (то же самое, что база + `dev`), оставлен явным
# для читаемости команды и на случай, если в `dependencies` позже вернётся что-то тяжёлое.
cloud = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.5",
    "pyyaml>=6.0.3",
    "numpy",
    "requests>=2.34.2",
    "httpx",              # нужен fastapi.testclient
    "fastapi>=0.122.0",
    "uvicorn>=0.38.0",
    "jinja2>=3.1.6",
    "python-telegram-bot>=22.6",
    "psutil>=7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = ["unit: fast, no I/O", "asyncio: pytest-asyncio-run test"]
